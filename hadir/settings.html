<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College de Paris Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div class="sidebar d-flex flex-column p-3">
    <img src="logo.png" alt="Logo" class="img-fluid mb-4" style="max-height: 60px;">
    <nav class="nav flex-column">
      <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <a class="nav-link" href="profile.html"><i class="bi bi-person-circle me-2"></i>Profile</a>
      <a class="nav-link active" href="settings.html"><i class="bi bi-gear me-2"></i>Settings</a>
      <a class="nav-link" href="#"><i class="bi bi-box-arrow-left me-2"></i>Log Out</a>
    </nav>
  </div>

  <div class="main-content">
    <div class="header">
      <div>Tue, 10 June 2025</div>
      <div><i class="bi bi-person-circle me-2"></i>Hadyr Ben Ali</div>
    </div>

    <div class="settings-box">
      <h5>Account</h5>
      <button class="btn w-100" onclick="editProfile()"><i class="bi bi-pencil-square"></i> Edit Profile <i class="bi bi-chevron-right"></i></button>
      <button class="btn w-100" onclick="toggleChangePassword()"><i class="bi bi-lock"></i> Change Password <i class="bi bi-chevron-right"></i></button>
      <button class="btn w-100" onclick="toggleDarkMode()">
        <i class="bi bi-moon"></i> Dark Mode 
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" role="switch" id="darkModeSwitch">
        </div>
      </button>

      <div id="changePasswordSection" style="display: none;" class="mt-3">
        <input type="password" id="oldPassword" placeholder="Old Password" class="form-control mb-2">
        <input type="password" id="newPassword" placeholder="New Password" class="form-control mb-2">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" class="form-control mb-2">
        <button class="btn btn-warning" onclick="submitPasswordChange()">Submit</button>
      </div>

      <h5 class="mt-4">Other</h5>
      <button class="btn w-100" onclick="showTerms()"><i class="bi bi-file-earmark-text"></i> Terms & Conditions <i class="bi bi-chevron-right"></i></button>
      <button class="btn w-100" onclick="changeLanguage()"><i class="bi bi-translate"></i> Language <i class="bi bi-chevron-right"></i></button>
      <button class="btn w-100 text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout <i class="bi bi-chevron-right"></i></button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
